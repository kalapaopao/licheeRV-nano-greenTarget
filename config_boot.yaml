# fly_LicheeRV / GC4653 adjustable camera settings
# Flat YAML only: key: value; no nested sections, quotes, or lists.
# Modify this file on the board, then restart sh start.sh to apply.

# manual = fixed exposure + gain; auto = ISP auto exposure.
exposure_mode: manual
manual_exposure_us: 3000
manual_analog_gain_x1024: 1024
manual_digital_gain_x1024: 1024
manual_isp_gain_x1024: 1024

# Auto-mode limits: 0 means keep ISP default maximum.
auto_exposure_max_us: 0
auto_analog_gain_max_x1024: 0
auto_digital_gain_max_x1024: 0
auto_isp_gain_max_x1024: 0

# Black level correction: manual or default (use ISP defaults).
black_level_mode: manual
black_level_r: 256
black_level_gr: 256
black_level_gb: 256
black_level_b: 256

# MJPEG JPEG quality, valid range: 75..90.
jpeg_quality: 85

# Default run length in seconds, valid range: 20..300.
run_seconds: 0

# Recording switch: true = every start records an MJPEG/AVI into recordings/
# (no --recoding argument needed); false = preview only.
record_enable: false

# Web preview bind: auto = all interfaces (USB 10.133.124.1 AND Wi-Fi both work);
# usb = USB NIC only; wifi = Wi-Fi NIC only.
web_ip: auto

# Display switch: true = start JPEG encoder + HTTP preview (draws detection box);
# false = no encoder, no web server (combat mode: saves CPU and heat).
display_enable: true

# Detection sampling density inside each stride block: 1=fastest(3.7ms)
# 2=balanced(9.4ms, default) 4=best small-target(27ms, halves fps).
detect_sample_steps: 1
# Run detection every Nth captured frame (1 = every frame).
detect_stride: 1

# Detection switch: false = skip the green-target detector entirely
# (pure capture, useful for measuring the detector's cost).
detect_enable: true

# ===========================================================================
# 阶段1：多目标筛选 + 卡尔曼 + 角度输出 + 串口（联调用）
# ===========================================================================

# 目标跟踪链路开关：true = 多候选筛选 + 卡尔曼 + 角度 + 串口；
# false = 完全不跑这条链路（等同纯取流/预览）。
track_enable: true

# ---- 相机内参（针孔模型，单位像素）----------------------------------------
# ⚠️ 下面的值是「按同型号 1280x720 相机估算的占位值」，不是本机标定结果。
#    必须用棋盘格标定后替换，否则角度会有系统偏差（估算水平 FOV≈64°）。
#    标定方法见 docs/CALIBRATION.md。
cam_fx: 1023.2
cam_fy: 1022.2
cam_cx: 643.8
cam_cy: 382.8

# 光轴补偿：装配完成后微调，把「镜头光轴」和「机械零位」的偏差补掉。
# 正值表示从结果里减去该角度。标定内参后再用远处目标微调这两个值。
optical_yaw_deg: 0.0
optical_pitch_deg: 0.0

# 方向翻转：安装方式不同时用这两个开关适配，不用改代码。
# 例如相机倒装则把 cam_invert_pitch 设为 true。
cam_invert_yaw: false
cam_invert_pitch: false

# 目标实际直径（米）：单目测距用。距离 = 焦距 × 实际直径 / 像素直径。
# ⚠️ 必须实测目标灯的实际直径后修改，否则距离不准。
target_diameter_m: 0.05

# ---- 多目标筛选 -----------------------------------------------------------
# 评分 = sel_conf_weight × 质量分 + (1-该值) × 「离预测位置有多近」
# 值越大越信任目标本身的质量，越小越倾向于「跟着上次那个」。
sel_conf_weight: 0.5
# 长宽比上限（长边/短边）。圆形目标接近 1，超过该值直接淘汰。
sel_max_aspect: 1.5
# 距离评分的归一化尺度（度）。候选偏离预测超过该角度，距离分为 0。
sel_max_dist_deg: 60.0
# 单帧最多保留的候选数（1..32）。
sel_max_candidates: 8
# 连续命中多少帧才对外报「已确认」（防单帧误检）。
sel_confirm_frames: 5
# 连续未命中多少帧才报「丢失」（期间用卡尔曼预测继续输出，减少下游抖动）。
sel_lost_frames: 10

# ---- 卡尔曼（角度域）------------------------------------------------------
# 过程噪声：越大越信任新测量、响应快但抖动大。
kf_process_noise: 50.0
# 测量噪声：越大越平滑、但滞后越大。
kf_measure_noise: 0.001
kf_init_pos_var: 10.0
kf_init_vel_var: 2.0

# ---- 串口输出（发给电控）--------------------------------------------------
# ⚠️ 默认关闭。开启后若设备打不开，camera 会直接退出（返回码 3），
#    因为联调时「静默收不到数据」比启动失败更难排查。
uart_enable: false
# /dev/ttyS0 是内核 console（被 getty 占用），不能用；S1~S4 空闲。
uart_device: /dev/ttyS1
uart_baud: 115200
# 发送频率（Hz）。固定节奏发送，即使没有目标也发心跳帧。
uart_rate_hz: 50

