# fly_LicheeRV / GC4653 adjustable camera settings
# Flat YAML only: key: value; no nested sections, quotes, or lists.
# Modify this file on the board, then restart sh start.sh to apply.

# manual = fixed exposure + gain; auto = ISP auto exposure.
exposure_mode: manual
manual_exposure_us: 3000
manual_analog_gain_x1024: 1024
manual_digital_gain_x1024: 1024
manual_isp_gain_x1024: 1024

# Auto-mode limits: 0 means keep ISP default maximum.
auto_exposure_max_us: 0
auto_analog_gain_max_x1024: 0
auto_digital_gain_max_x1024: 0
auto_isp_gain_max_x1024: 0

# Black level correction: manual or default (use ISP defaults).
black_level_mode: manual
black_level_r: 256
black_level_gr: 256
black_level_gb: 256
black_level_b: 256

# MJPEG JPEG quality, valid range: 75..90.
jpeg_quality: 80

# Default run length in seconds, valid range: 20..300.
run_seconds: 0

# Recording switch: true = every start records an MJPEG/AVI into recordings/
# (no --recoding argument needed); false = preview only.
record_enable: true

# Web preview bind: auto = all interfaces (USB 10.133.124.1 AND Wi-Fi both work);
# usb = USB NIC only; wifi = Wi-Fi NIC only.
web_ip: auto

# Display switch: true = start JPEG encoder + HTTP preview (draws detection box);
# false = no encoder, no web server (combat mode: saves CPU and heat).
display_enable: true
# 网页服务（MJPEG 预览/抓图）。关掉可省 CPU：录像与编码不受影响。
http_enable: false

# Detection sampling density inside each stride block: 1=fastest(3.7ms)
# 2=balanced(9.4ms, default) 4=best small-target(27ms, halves fps).
detect_sample_steps: 1
# Run detection every Nth captured frame (1 = every frame).
detect_stride: 1

# Detection switch: false = skip the green-target detector entirely
# (pure capture, useful for measuring the detector's cost).
detect_enable: true

# 画面左上角叠加电控状态（烧进像素里，所以录像/网页/抓图都看得到）。
# 4 行：帧号+STATE+SEQ+电控数据年龄 / 陀螺 GX GY GZ / 姿态 R P Y / 目标角。
# 数据取自「这一帧采集时刻」的最近一帧电控数据，编码丢帧也不会错位。
osd_enable: false
# 字号倍数：1=8px 高（省地方但小），2=16px（推荐），3=24px（远看）
osd_scale: 1

# ===========================================================================
# 阶段1：多目标筛选 + 卡尔曼 + 角度输出 + 串口（联调用）
# ===========================================================================

# 目标跟踪链路开关：true = 多候选筛选 + 卡尔曼 + 角度 + 串口；
# false = 完全不跑这条链路（等同纯取流/预览）。
track_enable: true

# ---- 相机内参（针孔模型，单位像素）----------------------------------------
# ⚠️ 下面的值是「按同型号 1280x720 相机估算的占位值」，不是本机标定结果。
#    必须用棋盘格标定后替换，否则角度会有系统偏差（估算水平 FOV≈64°）。
#    标定方法见 docs/CALIBRATION.md。
# 宽度裁剪（像素，0 = 不裁）。用来裁掉相机保护盖造成的左右黑边。
# 居中裁：左右各去 (1280 - 该值)/2 像素；高度不裁。
# ⚠ 必须是 64 的倍数（代码会自动向下取整到 64 的倍数）。
#   原因：VI 的 stride 按 64 对齐；若 width≠stride，编码器会把行尾填充当像素，
#   画面拉斜、JPEG 体积暴涨（实测 1104 -> stride 1152 -> 体积 84KB 而正常约 19KB）。
#   合法的宽度值：1280 / 1216 / 1152 / 1088 / 1024 / 960 / 896 ...
# 实测参考（1280 宽满幅 = 100%）：
#   1280 -> 不裁      体积 100%
#   1152 -> FOV 90%   体积  89%
#   1104 -> FOV 86%   体积  85%（推荐：基本只去掉近黑区域）
#   1024 -> FOV 80%   体积  77%
# 注意：裁剪后主点会自动左移 (1280-该值)/2，所以下面的 cam_cx 仍按满幅填，不用改。
cam_crop_width: 1088

cam_fx: 1023.2
cam_fy: 1022.2
cam_cx: 643.8
cam_cy: 382.8

# 光轴补偿：装配完成后微调，把「镜头光轴」和「机械零位」的偏差补掉。
# 正值表示从结果里减去该角度。标定内参后再用远处目标微调这两个值。
optical_yaw_deg: 0.0
optical_pitch_deg: 0.0

# 方向翻转：安装方式不同时用这两个开关适配，不用改代码。
# 例如相机倒装则把 cam_invert_pitch 设为 true。
cam_invert_yaw: false
cam_invert_pitch: false

# 目标实际直径（米）：单目测距用。距离 = 焦距 × 实际直径 / 像素直径。
# ⚠️ 必须实测目标灯的实际直径后修改，否则距离不准。
target_diameter_m: 0.05

# 瞄准点向上偏移系数（打的是绿灯上方的装甲板，不是绿灯中心；值抄自 HERO dart_vision_26 的 1.5）：
# 瞄准点 = 引导灯中心上方 (factor × 灯直径)，与距离无关、自动按框高缩放。
# 物理含义 = (装甲板中心到引导灯中心的距离) / (灯直径)。
# 0 = 打灯中心；1.5 = 打灯中心上方 1.5 个灯直径。联调时按实际弹着点微调（范围 0.0~5.0）。
target_up_offset_factor: 1.5

# ---- 多目标筛选 -----------------------------------------------------------
# 评分 = sel_conf_weight × 质量分 + (1-该值) × 「离预测位置有多近」
# 值越大越信任目标本身的质量，越小越倾向于「跟着上次那个」。
sel_conf_weight: 0.5
# 长宽比上限（长边/短边）。圆形目标接近 1，超过该值直接淘汰。
sel_max_aspect: 1.5
# 距离评分的归一化尺度（度）。候选偏离预测超过该角度，距离分为 0。
sel_max_dist_deg: 60.0
# 单帧最多保留的候选数（1..32）。
sel_max_candidates: 8
# 连续命中多少帧才对外报「已确认」（防单帧误检）。
sel_confirm_frames: 5
# 连续未命中多少帧才报「丢失」（期间用卡尔曼预测继续输出，减少下游抖动）。
sel_lost_frames: 10

# ---- 卡尔曼（角度域）------------------------------------------------------
# 过程噪声：越大越信任新测量、响应快但抖动大。
kf_process_noise: 50.0
# 测量噪声：越大越平滑、但滞后越大。
kf_measure_noise: 0.001
kf_init_pos_var: 10.0
kf_init_vel_var: 2.0

# ---- 串口输出（发给电控）--------------------------------------------------
# 总开关。开启后若设备打不开，camera 会直接退出（返回码 3），
# 因为联调时「静默收不到数据」比启动失败更难排查。
#
# 现场接线（2026-11-20 起）：通讯改到 **UART1**，设备节点就是 /dev/ttyS1。
#   UART0 = /dev/ttyS0 = 内核 console（getty + 内核日志都在这，**不要用于电控**）
#   UART1 = /dev/ttyS1 = 右排 GPIOA19(TX) / GPIOA18(RX)，空闲、干净
#   接法：视觉 TX → 电控 RX；电控 TX → 视觉 RX；两板共地；3.3V 电平
uart_enable: true
uart_device: /dev/ttyS1
uart_baud: 115200
# 发送频率（Hz）。固定节奏发送，即使没有目标也发心跳帧。
uart_rate_hz: 50
# 帧格式：
#   ascii  = v1 文本帧 `$GT,...*CS`（串口助手可直接看，校验和是 'GT,' 之后正文的 XOR）
#   binary = v2 定长二进制帧（28 字节：A5 5A 15 SEQ 01 + 21 字节数据 + CRC16-CCITT-FALSE）
#            协议见 docs/UART_PROTOCOL_V2_DESIGN.md，实现见 src/uart_frame.cpp
# ⚠️ 只有电控侧解析器已按 v2 实现才切 binary，否则会「有数据但解析不出来」。
# 出厂设为 binary：按 docs/UART_PROTOCOL_V2_DESIGN.md 与电控对接；用串口助手调试时改回 ascii 即可。
uart_format: binary
# 接收方向（电控 → 视觉 CMD=0x02）：跑程序时把电控发来的姿态/状态打印到终端，只打印不参与计算。
# 电控按 100Hz 发，这里限频打印，避免刷屏；联调时改成 20 更跟手。
uart_rx_print: true
uart_rx_print_hz: 10
# 发送开关：true = 正常收发；false = 只收不发（端口仍以 115200 打开，用于纯数据采集）。
uart_tx_enable: true

# ===========================================================================
# 飞行数据记录（T+ 预录触发）
# ===========================================================================
# 触发源：电控 CMD=0x02 的 STATE 边沿（STATIC→FLIGHT 起飞，FLIGHT→* 落地）。
# 视觉侧没有 IMU，所以 trigger 模式必须 uart_enable=true（只收不发也行：uart_tx_enable=false）。
#
# 产物（每次起飞一个目录）：
#   logs/sess_<开机秒数>s_<pid>_<n>/frames.csv   相机每帧一行（含 frame_id / 采集时刻 / 角度 / 像素）
#   logs/sess_<开机秒数>s_<pid>_<n>/mcu.csv      电控每帧一行（SEQ/STATE/FLAGS/欧拉角/陀螺）
#   logs/sess_<开机秒数>s_<pid>_<n>/meta.txt     触发时刻、配置快照、结束原因、丢行数
#   logs/health_<..>.csv                         每秒一行，答「这场为什么没记到」
#   logs/video_frames_<..>.csv                   AVI 帧号 ↔ 相机帧号（录像对帧用）
log_enable: true
# trigger = 只记起飞→落地这一段（带预录）；continuous = 开机即连续记录。
log_mode: trigger
# 预录窗口（毫秒）：触发前这么多秒的数据进环形缓冲，触发时整体落盘。
# 别设 0——电控判定 + 10ms 发送 + 视觉接收，飞机早就离手了，0 必然丢开头。
log_preroll_ms: 1500
# 视频预录（毫秒），与上面的 log_preroll_ms 分开。
# >0 = 视频也保留触发前画面。触发瞬间要把这段一次性写进 SD 卡，
#     编码线程被占用期间实时帧会被丢弃 —— 空档时长 ≈ flush 字节数 ÷ 写卡速度。
# 实测（1088x720 / q80，2026-11-24）：
#   1500ms -> flushed 104 帧 3.77MB, 耗时 233ms, 起飞处空档 250ms  ← 现在的选择
#   3000ms -> 约 9MB, 耗时 0.6~0.9s, 空档 0.6~0.9s（景暗时能到 1.5s 以上）
# 0 = 不缓冲视频帧，视频从触发那一刻开始（空档仅 0.03s，但没有起飞前画面）。
video_preroll_ms: 1500

# 落地后继续记多久（电控 STOP 后会继续发帧，尾声也要）。
log_postroll_ms: 2000
# 单段上限（秒）：防止一直不离开 FLIGHT 时把卡写满；到点强制收尾，meta 里写 max_seconds。
# 单段上限（秒）。到点强制收尾，meta 里写 close_reason=max_seconds。
# ⚠ 触发是边沿式：一旦到点收尾，只要电控 STATE 还停在 FLIGHT，就不会再开新段，
#   后面的视频和数据会**静默丢失**。所以这个值必须大于最长一次飞行，宁可放大。
log_max_seconds: 120
# 是否额外保存 100Hz 原始电控流（mcu.csv）。
# 默认 false：frames.csv 每行已带该帧时刻的电控数据，单文件就是成品表；
# 只有想看两帧之间的完整波形时才打开。
log_mcu_stream: false
# 一次飞行（会话）归档完就退出进程，不常驻待命。
# true = 落地 + postroll 后程序自己结束（省电降温，适合赛场单次发射）
# false = 常驻待命，等下一次起飞（适合反复调试）
exit_after_land: true
# 程序结束后自动重启（不断电连续使用）。覆盖这些退出原因：
#   落地归档完 / run_seconds 到点 / 过热停机 / 相机崩溃
# 不重启：手动 stop、时钟被改、MIPI 异常（那些是真问题，重启会把故障藏起来）。
# 每轮重启前会先等会话收尾、停掉相机、温度过高则先降温。
# 落地 → 归档 → 相机退出（释放 VI/ISP，开始降温）→ 等几秒 → 重新拉起待命。
# 只有「落地收工」会重启；崩溃/过热/MIPI 异常一律不自动重启。
auto_restart: true
auto_restart_max: 0          # 最多跑到第几轮，0 = 不限；1 = 只跑一轮（等于不重启）
auto_restart_delay_s: 3      # 相机退出后等几秒再拉起
auto_restart_cool_millic: 70000   # 重启前若温度高于 70°C，先等它降下来
auto_restart_on_timeout: false    # 超时退出是否也重启（默认否：只在落地后重启）
auto_restart_min_run_s: 20        # 一轮运行短于此值算「快速失败」
auto_restart_max_short: 3         # 连续快速失败超过此次数就放弃重启（防崩溃死循环）
auto_restart_wait_session_s: 60   # 重启前最多等会话收尾多少秒（避免把飞行从中间切断）
# 记录目录；留空（注释掉）= 程序目录下的 logs/。必须是绝对路径。
# log_dir: /code/fly_LicheeRV/logs

# ===========================================================================
# 诊断：分类打印开关 + 运行状态历史
# ===========================================================================
# 总开关。false = 除错误行和退出摘要外什么都不打（stdout/日志都安静），
# 但 state/run_history.log 照写——那是开机自启动"到底跑没跑起来"的唯一证据。
print_enable: true
# 分类开关（只在 print_enable=true 时有效）。默认全开 = 与改动前完全一样。
print_boot: true      # 启动诊断：池/传感器/VI/VENC/CAMERA_READY
print_isp: true       # 曝光/黑电平/ISP 调参与 5 秒回读
print_target: true    # 绿灯检测结果（GREEN_TARGET / GREEN_STAT）
print_perf: true      # 每 5 秒性能统计（capture_frames/DETECT/TIMING/PTS_STAT/CLOCK36）
print_uart: true      # 串口发送统计与启动行
print_mcu: true       # 电控下行帧（[MCU] ...）
print_log: true       # 记录器状态（LOG / LOG_SESSION_*）
print_avi: true       # 录像保存提示
# 运行状态目录；留空（注释掉）= 程序目录下的 state/。必须是绝对路径。
# state_dir: /code/fly_LicheeRV/state
